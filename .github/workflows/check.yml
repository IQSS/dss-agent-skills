name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned check runner
        run: |
          python -m pip install uv==0.13.9
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/dss-agent-skills-venv" >> "$GITHUB_ENV"
      - name: Check repository
        run: python scripts/check-self-contained.py . --plugin .claude-plugin/plugin.json --check-metadata --check-public-source
      - name: Validate skill format
        run: |
          for skill in */SKILL.md; do
            uv run --locked agentskills validate "$(dirname "$skill")"
          done
      - name: Test helpers
        run: python -B -m unittest discover -s tests -v
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"
      - name: Build catalogue
        run: |
          python scripts/build-catalogue.py
          quarto render
      - name: Check pages and downloads
        run: python scripts/check-site.py
      - name: Configure GitHub Pages
        if: github.repository == 'IQSS/dss-agent-skills' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload checked site
        if: github.repository == 'IQSS/dss-agent-skills' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.repository == 'IQSS/dss-agent-skills' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish checked site
        id: deployment
        uses: actions/deploy-pages@v4
